server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Support React Router client-side navigation
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend (only needed when both containers are on the same network)
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    # }
}
